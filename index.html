<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lomalo QA Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased">
  <header class="border-b border-gray-800/80">
    <div class="max-w-5xl mx-auto px-5 pt-10 pb-6">
      <h1 class="text-lg font-semibold tracking-tight">Lomalo QA Reports</h1>
      <p class="text-sm text-gray-500 mt-1.5">
        Maestro E2E runs for rmi-wallet and rmi-merchants, newest first.
      </p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-5 py-8">
    <div id="filters" class="flex gap-1.5 flex-wrap mb-6 p-1 bg-gray-900/60 border border-gray-800 rounded-lg w-fit">
      <button data-repo="all" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors bg-gray-800 text-gray-100">All</button>
      <button data-repo="rmi-wallet" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors text-gray-400 hover:text-gray-200">rmi-wallet</button>
      <button data-repo="rmi-merchants" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors text-gray-400 hover:text-gray-200">rmi-merchants</button>
    </div>

    <div class="overflow-x-auto rounded-xl border border-gray-800 bg-gray-900/30">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-[11px] uppercase tracking-wider text-gray-500 border-b border-gray-800">
            <th class="px-4 py-3 font-semibold">Status</th>
            <th class="px-4 py-3 font-semibold">Repo</th>
            <th class="px-4 py-3 font-semibold">Platform</th>
            <th class="px-4 py-3 font-semibold">Branch</th>
            <th class="px-4 py-3 font-semibold">Commit</th>
            <th class="px-4 py-3 font-semibold">Flows</th>
            <th class="px-4 py-3 font-semibold">Duration</th>
            <th class="px-4 py-3 font-semibold">When</th>
            <th class="px-4 py-3 font-semibold"></th>
          </tr>
        </thead>
        <tbody id="runs-body" class="divide-y divide-gray-800/70"></tbody>
      </table>
      <div id="empty-state" class="text-center text-gray-500 py-16 text-sm" hidden>No runs published yet.</div>
    </div>
  </main>

  <footer class="max-w-5xl mx-auto px-5 pb-10 pt-2">
    <p class="text-xs text-gray-600">
      Auto-published by CI after every Maestro run — never edited by hand.
    </p>
  </footer>

  <script>
    let allRuns = [];
    let activeRepo = "all";

    function capitalize(value) {
      return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
    }

    function platformLabel(platform) {
      const known = { ios: "iOS", android: "Android" };
      return known[platform] ?? capitalize(platform);
    }

    function formatDuration(seconds) {
      if (seconds == null) return "—";
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60);
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function formatWhen(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function render() {
      const tbody = document.getElementById("runs-body");
      const emptyState = document.getElementById("empty-state");
      const rows = allRuns.filter((r) => activeRepo === "all" || r.repo === activeRepo);

      if (rows.length === 0) {
        tbody.innerHTML = "";
        emptyState.hidden = false;
        return;
      }
      emptyState.hidden = true;

      tbody.innerHTML = rows
        .map((r) => {
          const allPassed = r.failed === 0;
          const badge = allPassed
            ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-500/10 text-emerald-400 ring-1 ring-inset ring-emerald-500/20">PASS</span>`
            : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold bg-red-500/10 text-red-400 ring-1 ring-inset ring-red-500/20">FAIL</span>`;
          const detailLink = r.detailPath
            ? `<a class="text-blue-400 hover:text-blue-300 font-medium transition-colors" href="${r.detailPath}">Details</a>`
            : "";
          const commitLink = r.commitUrl
            ? `<a class="text-blue-400 hover:text-blue-300 transition-colors" href="${r.commitUrl}"><code class="bg-gray-800/80 px-1.5 py-0.5 rounded text-xs">${r.shortSha ?? ""}</code></a>`
            : `<code class="bg-gray-800/80 px-1.5 py-0.5 rounded text-xs">${r.shortSha ?? ""}</code>`;
          return `
            <tr class="hover:bg-gray-900/60 transition-colors">
              <td class="px-4 py-3.5">${badge}</td>
              <td class="px-4 py-3.5"><span class="inline-block px-2 py-0.5 rounded bg-gray-800/80 text-xs text-gray-300">${r.repo}</span></td>
              <td class="px-4 py-3.5 text-gray-300">${platformLabel(r.platform) ?? "—"}</td>
              <td class="px-4 py-3.5 text-gray-300">${r.branch ?? "—"}</td>
              <td class="px-4 py-3.5">${commitLink}</td>
              <td class="px-4 py-3.5 text-gray-300 tabular-nums">${r.passed}/${r.totalFlows}</td>
              <td class="px-4 py-3.5 text-gray-400 tabular-nums">${formatDuration(r.totalDurationSeconds)}</td>
              <td class="px-4 py-3.5 text-gray-500">${formatWhen(r.timestamp)}</td>
              <td class="px-4 py-3.5 text-right">${detailLink}</td>
            </tr>`;
        })
        .join("");
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-repo]");
      if (!btn) return;
      activeRepo = btn.dataset.repo;
      document.querySelectorAll(".filter-btn").forEach((b) => {
        const isActive = b === btn;
        b.classList.toggle("bg-gray-800", isActive);
        b.classList.toggle("text-gray-100", isActive);
        b.classList.toggle("text-gray-400", !isActive);
      });
      render();
    });

    fetch("data/index.json", { cache: "no-store" })
      .then((res) => res.json())
      .then((data) => {
        allRuns = Array.isArray(data) ? data : [];
        render();
      })
      .catch(() => {
        allRuns = [];
        render();
      });
  </script>
</body>
</html>
