<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lomalo QA Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <header class="max-w-5xl mx-auto px-5 pt-8 pb-4">
    <h1 class="text-xl font-semibold">Lomalo QA Reports</h1>
    <p class="text-sm text-gray-400 mt-1">Maestro E2E runs for rmi-wallet and rmi-merchants, newest first.</p>
  </header>

  <main class="max-w-5xl mx-auto px-5 pb-16">
    <div id="filters" class="flex gap-2 flex-wrap mb-5">
      <button data-repo="all" class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-700 bg-gray-900 text-blue-400 border-blue-500">All</button>
      <button data-repo="rmi-wallet" class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-700 bg-gray-900 hover:border-gray-500">rmi-wallet</button>
      <button data-repo="rmi-merchants" class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-700 bg-gray-900 hover:border-gray-500">rmi-merchants</button>
    </div>

    <div class="overflow-x-auto rounded-lg border border-gray-800">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs uppercase tracking-wide text-gray-400 border-b border-gray-800">
            <th class="px-4 py-3 font-medium">Status</th>
            <th class="px-4 py-3 font-medium">Repo</th>
            <th class="px-4 py-3 font-medium">Platform</th>
            <th class="px-4 py-3 font-medium">Branch</th>
            <th class="px-4 py-3 font-medium">Commit</th>
            <th class="px-4 py-3 font-medium">Flows</th>
            <th class="px-4 py-3 font-medium">Duration</th>
            <th class="px-4 py-3 font-medium">When</th>
            <th class="px-4 py-3 font-medium"></th>
          </tr>
        </thead>
        <tbody id="runs-body"></tbody>
      </table>
      <div id="empty-state" class="text-center text-gray-500 py-12" hidden>No runs published yet.</div>
    </div>
  </main>

  <script>
    let allRuns = [];
    let activeRepo = "all";

    function capitalize(value) {
      return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
    }

    function platformLabel(platform) {
      const known = { ios: "iOS", android: "Android" };
      return known[platform] ?? capitalize(platform);
    }

    function formatDuration(seconds) {
      if (seconds == null) return "—";
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60);
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function formatWhen(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function render() {
      const tbody = document.getElementById("runs-body");
      const emptyState = document.getElementById("empty-state");
      const rows = allRuns.filter((r) => activeRepo === "all" || r.repo === activeRepo);

      if (rows.length === 0) {
        tbody.innerHTML = "";
        emptyState.hidden = false;
        return;
      }
      emptyState.hidden = true;

      tbody.innerHTML = rows
        .map((r) => {
          const allPassed = r.failed === 0;
          const badge = allPassed
            ? `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-400">PASS</span>`
            : `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-500/15 text-red-400">FAIL</span>`;
          const detailLink = r.detailPath
            ? `<a class="text-blue-400 hover:underline" href="${r.detailPath}">DETAILS</a>`
            : "";
          const commitLink = r.commitUrl
            ? `<a class="text-blue-400 hover:underline" href="${r.commitUrl}"><code class="bg-gray-900 px-1.5 py-0.5 rounded">${r.shortSha ?? ""}</code></a>`
            : `<code class="bg-gray-900 px-1.5 py-0.5 rounded">${r.shortSha ?? ""}</code>`;
          return `
            <tr class="border-b border-gray-800 last:border-0 hover:bg-gray-900/60">
              <td class="px-4 py-3">${badge}</td>
              <td class="px-4 py-3"><span class="inline-block px-2 py-0.5 rounded bg-gray-900 border border-gray-800 text-xs">${r.repo}</span></td>
              <td class="px-4 py-3 text-gray-300">${platformLabel(r.platform) ?? "—"}</td>
              <td class="px-4 py-3 text-gray-300">${r.branch ?? "—"}</td>
              <td class="px-4 py-3">${commitLink}</td>
              <td class="px-4 py-3 text-gray-300">${r.passed}/${r.totalFlows}</td>
              <td class="px-4 py-3 text-gray-300">${formatDuration(r.totalDurationSeconds)}</td>
              <td class="px-4 py-3 text-gray-400">${formatWhen(r.timestamp)}</td>
              <td class="px-4 py-3">${detailLink}</td>
            </tr>`;
        })
        .join("");
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-repo]");
      if (!btn) return;
      activeRepo = btn.dataset.repo;
      document.querySelectorAll(".filter-btn").forEach((b) => {
        const isActive = b === btn;
        b.classList.toggle("text-blue-400", isActive);
        b.classList.toggle("border-blue-500", isActive);
        b.classList.toggle("border-gray-700", !isActive);
      });
      render();
    });

    fetch("data/index.json", { cache: "no-store" })
      .then((res) => res.json())
      .then((data) => {
        allRuns = Array.isArray(data) ? data : [];
        render();
      })
      .catch(() => {
        allRuns = [];
        render();
      });
  </script>
</body>
</html>
