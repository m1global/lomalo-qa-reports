<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Run detail — Lomalo QA Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased">
  <header class="border-b border-gray-800/80">
    <div class="max-w-3xl mx-auto px-5 pt-10 pb-6">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-gray-300 transition-colors mb-3">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Dashboard
      </a>
      <h1 id="title" class="text-lg font-semibold tracking-tight">Loading…</h1>
      <div id="subtitle" class="text-sm text-gray-500 mt-1.5"></div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-8">
    <div class="overflow-x-auto rounded-xl border border-gray-800 bg-gray-900/30">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-[11px] uppercase tracking-wider text-gray-500 border-b border-gray-800">
            <th class="px-4 py-3 font-semibold">Status</th>
            <th class="px-4 py-3 font-semibold">Flow</th>
            <th class="px-4 py-3 font-semibold">Duration</th>
          </tr>
        </thead>
        <tbody id="flows-body" class="divide-y divide-gray-800/70"></tbody>
      </table>
      <div id="error-state" class="text-center text-gray-500 py-16 text-sm" hidden>Run not found.</div>
    </div>
  </main>

  <script>
    function capitalize(value) {
      return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
    }

    function platformLabel(platform) {
      const known = { ios: "iOS", android: "Android" };
      return known[platform] ?? capitalize(platform);
    }

    function formatDuration(seconds) {
      if (seconds == null) return "—";
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60);
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function renderError() {
      document.getElementById("title").textContent = "Run not found";
      document.getElementById("error-state").hidden = false;
    }

    const CHEVRON_SVG = `<svg class="chevron shrink-0 transition-transform duration-200" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;

    function renderFlows(flows) {
      const tbody = document.getElementById("flows-body");
      tbody.innerHTML = (flows || [])
        .map((f, i) => {
          const passed = f.status === "passed";
          const badgeClass = passed
            ? "bg-emerald-500/10 text-emerald-400 ring-1 ring-inset ring-emerald-500/20"
            : "bg-red-500/10 text-red-400 ring-1 ring-inset ring-red-500/20";
          const clickable = !!f.failureMessage;
          const row = `
            <tr class="hover:bg-gray-900/60 transition-colors${clickable ? " cursor-pointer" : ""}"${clickable ? ` data-toggle="failure-${i}"` : ""}>
              <td class="px-4 py-3.5"><span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold ${badgeClass}">${passed ? "PASS" : "FAIL"}</span></td>
              <td class="px-4 py-3.5 text-gray-300">
                <span class="inline-flex items-center gap-1.5 text-gray-500">${clickable ? CHEVRON_SVG : ""}</span>
                <span class="text-gray-300">${f.name}</span>
              </td>
              <td class="px-4 py-3.5 text-gray-400 tabular-nums">${formatDuration(f.durationSeconds)}</td>
            </tr>`;
          const failureRow = clickable
            ? `
            <tr id="failure-${i}" hidden>
              <td colspan="3" class="px-4 pb-4 -mt-1">
                <div class="pl-3 border-l-2 border-red-500/30 text-xs text-gray-400 font-mono break-words leading-relaxed">${f.failureMessage}</div>
              </td>
            </tr>`
            : "";
          return row + failureRow;
        })
        .join("");

      tbody.querySelectorAll("tr[data-toggle]").forEach((tr) => {
        tr.addEventListener("click", () => {
          const target = document.getElementById(tr.dataset.toggle);
          const chevron = tr.querySelector(".chevron");
          if (!target) return;
          target.hidden = !target.hidden;
          if (chevron) chevron.classList.toggle("rotate-180", !target.hidden);
        });
      });
    }

    const params = new URLSearchParams(window.location.search);
    const runPath = params.get("run");

    if (!runPath) {
      renderError();
    } else {
      fetch(runPath, { cache: "no-store" })
        .then((res) => {
          if (!res.ok) throw new Error("not found");
          return res.json();
        })
        .then((run) => {
          document.title = `${run.repo} — ${run.shortSha}`;
          document.getElementById("title").textContent =
            `${run.repo} — ${run.branch} @ ${run.shortSha}`;
          document.getElementById("subtitle").innerHTML = `
            ${run.passed}/${run.totalFlows} flows passed · ${formatDuration(run.totalDurationSeconds)} ·
            ${platformLabel(run.platform) ?? "—"} ·
            <a class="text-blue-400 hover:text-blue-300 transition-colors" href="${run.commitUrl}">Commit</a> ·
            <a class="text-blue-400 hover:text-blue-300 transition-colors" href="${run.runUrl}">CI Run</a>
          `;
          renderFlows(run.flows);
        })
        .catch(renderError);
    }
  </script>
</body>
</html>
