<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Run detail — Lomalo QA Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <header class="max-w-3xl mx-auto px-5 pt-8 pb-4">
    <h1 id="title" class="text-lg font-semibold">Loading…</h1>
    <div id="subtitle" class="text-sm text-gray-400 mt-1"></div>
  </header>

  <main class="max-w-3xl mx-auto px-5 pb-16">
    <div class="overflow-x-auto rounded-lg border border-gray-800">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs uppercase tracking-wide text-gray-400 border-b border-gray-800">
            <th class="px-4 py-3 font-medium">Status</th>
            <th class="px-4 py-3 font-medium">Flow</th>
            <th class="px-4 py-3 font-medium">Duration</th>
          </tr>
        </thead>
        <tbody id="flows-body"></tbody>
      </table>
      <div id="error-state" class="text-center text-gray-500 py-12" hidden>Run not found.</div>
    </div>
  </main>

  <script>
    function capitalize(value) {
      return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
    }

    function platformLabel(platform) {
      const known = { ios: "iOS", android: "Android" };
      return known[platform] ?? capitalize(platform);
    }

    function formatDuration(seconds) {
      if (seconds == null) return "—";
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60);
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function renderError() {
      document.getElementById("title").textContent = "Run not found";
      document.getElementById("error-state").hidden = false;
    }

    function renderFlows(flows) {
      const tbody = document.getElementById("flows-body");
      tbody.innerHTML = (flows || [])
        .map((f, i) => {
          const passed = f.status === "passed";
          const badgeClass = passed
            ? "bg-emerald-500/15 text-emerald-400"
            : "bg-red-500/15 text-red-400";
          const clickable = !!f.failureMessage;
          const row = `
            <tr class="border-b border-gray-800 last:border-0 hover:bg-gray-900/60${clickable ? " cursor-pointer" : ""}"${clickable ? ` data-toggle="failure-${i}"` : ""}>
              <td class="px-4 py-3"><span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${badgeClass}">${passed ? "PASS" : "FAIL"}</span></td>
              <td class="px-4 py-3 text-gray-300">${f.name}${clickable ? ' <span class="text-gray-600">▾</span>' : ""}</td>
              <td class="px-4 py-3 text-gray-300">${formatDuration(f.durationSeconds)}</td>
            </tr>`;
          const failureRow = clickable
            ? `
            <tr id="failure-${i}" class="border-b border-gray-800 last:border-0" hidden>
              <td class="px-4 pb-3" colspan="3">
                <div class="px-3 py-2 rounded bg-gray-900 text-xs text-red-400/80 font-mono break-words">${f.failureMessage}</div>
              </td>
            </tr>`
            : "";
          return row + failureRow;
        })
        .join("");

      tbody.querySelectorAll("tr[data-toggle]").forEach((tr) => {
        tr.addEventListener("click", () => {
          const target = document.getElementById(tr.dataset.toggle);
          if (target) target.hidden = !target.hidden;
        });
      });
    }

    const params = new URLSearchParams(window.location.search);
    const runPath = params.get("run");

    if (!runPath) {
      renderError();
    } else {
      fetch(runPath, { cache: "no-store" })
        .then((res) => {
          if (!res.ok) throw new Error("not found");
          return res.json();
        })
        .then((run) => {
          document.title = `${run.repo} — ${run.shortSha}`;
          document.getElementById("title").textContent =
            `${run.repo} — ${run.branch} @ ${run.shortSha}`;
          document.getElementById("subtitle").innerHTML = `
            ${run.passed}/${run.totalFlows} flows passed · ${formatDuration(run.totalDurationSeconds)} ·
            ${platformLabel(run.platform) ?? "—"} ·
            <a class="text-blue-400 hover:underline" href="${run.commitUrl}">Commit</a> ·
            <a class="text-blue-400 hover:underline" href="${run.runUrl}">CI Run</a> ·
            <a class="text-blue-400 hover:underline" href="index.html">Back to Dashboard</a>
          `;
          renderFlows(run.flows);
        })
        .catch(renderError);
    }
  </script>
</body>
</html>
